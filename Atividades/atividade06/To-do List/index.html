<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Tarefas</title>
</head>
<body>
    
    <form class="form" onsubmit="cadastrarTarefa(event)">
        <fieldset>
            <legend><strong>Lista de Tarefas: </strong></legend>
            <br>

            <label for="nome">Digite sua tarefa:</label>
            <input class="input" type="text" id="tarefa" name="tarefa" placeholder="Digite sua tarefa aqui..." required>
            <br><br>
            <button>Adicionar</button>
            <br><br>

            <ul class="lista">

            </ul>


        </fieldset>
    </form>

</body>
<script src="script.js"></script>
</html>
